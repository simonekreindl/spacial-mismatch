# This file lists all data sources used in this project

municipality_boundaries:
  source: "Geodetska uprava Republike Slovenije (GURS)"
  dataset: "Register prostorskih enot"
  wfs_layer: "SI.GURS.RPE:OBCINE"
  url: "https://www.e-prostor.gov.si/en/access-to-geodetic-data/"
  license: "CC-BY 4.0"
  accessed: "2026-09-04"

osm_poi_data:
  source: "OpenStreetMap contributors"
  dataset: "Points of interest (categories defined in config.yaml)"
  url: "https://www.openstreetmap.org/copyright"
  license: "ODbL"
  accessed: "2026-09-04"

population_data:
  source: "Statistical Office of the Republic of Slovenia (SURS)"
  dataset: "Population by MUNICIPALITIES, HALF-YEAR and AGE (05C4003S)"
  url: "https://pxweb.stat.si/SiStatData/pxweb/en/Data/Data/05C4003S.px"
  accessed: "2026-09-07"